name: Public binary consumer

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate consumer proof
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  consume:
    name: Cold public consumer (macOS)
    needs: validate
    # Keep native qualification on trusted repository branches; portable checks cover forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Standard macOS runners are free for this public repository.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve and build using only public artifacts
        # No credentials, source-repository checkout, signing identity, or shared cache.
        # Proof files stay in a unique RUNNER_TEMP directory; the ephemeral runner owns teardown.
        run: /usr/bin/python3 scripts/verify_binary_package.py --temporary-parent "$RUNNER_TEMP"
